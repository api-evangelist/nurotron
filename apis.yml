name: Nurotron
description: Nurotron (Zhejiang Nurotron Neural Electronic Technology Co., Ltd. / 诺尔康)
  is a Hangzhou, China-based medical device manufacturer specializing in neural electrical
  stimulation. Its self-developed neural-prosthesis and neuromodulation product lines
  span auditory reconstruction (cochlear implants and speech processors such as the
  CS-10A/CS-20A/CS-30A implant bodies and Airum/NSP processors), visual reconstruction,
  urological and pelvic-nerve disease treatment, and brain neuromodulation. The company
  runs a corporate marketing and patient-support website with product, technical-support,
  rehabilitation-community, and news sections. It is a hardware medical-device company
  and publishes no public developer API, SDK, or machine-readable API surface. Surfaced
  as a portfolio company of Qiming Venture Partners and added to the API Evangelist
  network for tracking.
